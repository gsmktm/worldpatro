name: CI
on:
  push:
    branches: [main, production-v1, firebase-v1, firebase-config, world-os-v2]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Commit updated dependency lockfile on feature branches
        if: github.event_name == 'push' && github.ref != 'refs/heads/main' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: lock production dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"
