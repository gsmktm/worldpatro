name: CI

on:
  push:
    branches: [main, production-v1, firebase-v1, firebase-config, world-os-v2, world-os-v2-meta, production-hardening-v2, production-hardening-v2-1, production-smoke-v2, public-api-integrations-v1, nepal-authority-privacy-v1, astronomy-golden-gate-v1, admin-console-fullstack-v1, admin-bootstrap-publication-v1, patro-linked-fullstack-v1, all-modules-functional-v1, wbgr-109-wens-brand-v1]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: External astronomical golden dates (USNO)
        run: node scripts/validate-astronomy.mjs
      - run: npm run build
      - name: Production smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm start -- -p 3100 > /tmp/worldpatro-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3100/api/v1/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/worldpatro-next.log
            exit 1
          fi

          BASE_URL=http://127.0.0.1:3100 node scripts/smoke-production.mjs
          BASE_URL=http://127.0.0.1:3100 node scripts/validate-wens.mjs
          BASE_URL=http://127.0.0.1:3100 node scripts/validate-route-graph.mjs
