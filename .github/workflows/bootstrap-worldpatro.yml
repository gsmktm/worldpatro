name: Bootstrap World Patro Source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/trigger'

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand World Patro source
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf .bootstrap/worldpatro.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-worldpatro.yml

      - name: Commit full application
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: add World Patro WBE-9 full-stack application"
          git push origin HEAD:main
